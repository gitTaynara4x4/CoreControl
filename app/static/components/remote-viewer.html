<section id="remoteViewer" class="remote-viewer hidden">
  <div class="remote-viewer-body">
    <header class="remote-viewer-header">
      <div class="remote-viewer-title-wrap">
        <strong id="remoteViewerTitle">Acesso remoto</strong>
        <small id="remoteViewerStatus">Preparando conexão segura...</small>
      </div>
      <div class="remote-viewer-actions">
        <button id="remoteViewerMinimize" type="button" class="btn small">Minimizar</button>
        <button id="remoteViewerFullscreen" type="button" class="btn small">Maximizar</button>
        <button id="remoteViewerNewTab" type="button" class="btn small">Abrir em nova guia</button>
        <button id="remoteViewerClose" type="button" class="btn danger small">Encerrar</button>
      </div>
    </header>
    <div id="remoteViewerLoading" class="remote-viewer-loading"><span></span><p>Conectando ao computador...</p></div>
    <iframe id="remoteViewerFrame" title="Área de trabalho remota" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
  </div>
</section>
<div id="remoteViewerDock" class="remote-viewer-dock hidden" aria-live="polite">
  <div class="remote-viewer-dock-title">
    <strong id="remoteViewerDockTitle">Acesso remoto</strong>
    <small id="remoteViewerDockStatus">Sessão minimizada</small>
  </div>
  <div class="remote-viewer-dock-actions">
    <button id="remoteViewerRestore" type="button" class="btn small">Restaurar</button>
    <button id="remoteViewerDockClose" type="button" class="btn danger small">Encerrar</button>
  </div>
</div>
