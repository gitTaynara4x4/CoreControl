<style id="remoteViewerScopedStyles">
.remote-viewer{position:fixed;inset:0;z-index:50;display:flex;overflow:hidden;background:#777;color:#262626;font-family:"Inter","Segoe UI",sans-serif}
.remote-viewer.hidden,.remote-viewer-dock.hidden{display:none!important}
.remote-viewer *,.remote-viewer-dock *{box-sizing:border-box}
.remote-anydesk-shell{width:100%;height:100%;min-height:0;display:grid;grid-template-rows:38px 42px minmax(0,1fr);overflow:hidden;background:#777}
.remote-viewer-tabbar{display:flex;align-items:stretch;height:38px;background:#f5f5f5;border-bottom:1px solid #c9c9c9;box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:4}
.remote-viewer-product{display:flex;align-items:center;gap:7px;min-width:119px;padding:0 13px;color:#242424;font-size:12px;font-weight:750;letter-spacing:-.02em;white-space:nowrap}
.remote-viewer-product-mark{display:inline-block;width:18px;height:18px;flex:0 0 18px;background:#ef403d;clip-path:polygon(0 25%,50% 0,100% 25%,100% 75%,50% 100%,0 75%);position:relative}
.remote-viewer-product-mark::after{content:"";position:absolute;inset:5px 4px;background:#fff;clip-path:polygon(0 0,100% 50%,0 100%)}
.remote-viewer-session-tab{display:flex;align-items:center;gap:7px;min-width:170px;max-width:min(390px,42vw);height:32px;align-self:flex-end;padding:0 7px 0 10px;border:1px solid #cfcfcf;border-bottom:0;border-radius:5px 5px 0 0;background:#fff;color:#2d2d2d;box-shadow:0 -1px 3px rgba(0,0,0,.04);font-size:11px}
.remote-viewer-session-tab svg{width:15px;height:15px;flex:0 0 15px;fill:none;stroke:#5b5b5b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.remote-viewer-session-tab strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.remote-viewer-tab-close{width:23px;height:23px;margin-left:auto;border:0;border-radius:4px;background:transparent;color:#777;font-size:18px;line-height:1;cursor:pointer}
.remote-viewer-tab-close:hover{background:#ededed;color:#222}
.remote-viewer-new-tab{width:34px;height:32px;align-self:flex-end;margin-left:3px;border:0;border-radius:5px 5px 0 0;background:transparent;color:#595959;font-size:22px;line-height:1;cursor:pointer}
.remote-viewer-new-tab:hover{background:#e9e9e9;color:#202020}
.remote-viewer-window-actions{display:flex;align-items:center;gap:1px;margin-left:auto;padding:0 7px}
.remote-viewer-window-button{display:grid;place-items:center;width:34px;height:27px;border:0;border-radius:4px;background:transparent;color:#464646;font-size:17px;line-height:1;cursor:pointer}
.remote-viewer-window-button:hover{background:#e5e5e5;color:#171717}
.remote-viewer-close-button:hover{background:#e94a4a;color:#fff}
.remote-viewer-commandbar{display:flex;align-items:center;gap:9px;height:42px;min-width:0;padding:0 9px;background:#ededed;border-bottom:1px solid #c4c4c4;box-shadow:0 1px 2px rgba(0,0,0,.1);z-index:3}
.remote-viewer-address{display:flex;align-items:center;gap:8px;width:min(280px,28vw);height:29px;padding:0 9px;border:1px solid #c4c4c4;border-radius:4px;background:#fff;color:#3c3c3c;font-size:11px;box-shadow:inset 0 1px 1px rgba(0,0,0,.03)}
.remote-viewer-address span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.remote-viewer-online-dot{width:11px;height:11px;flex:0 0 11px;border-radius:50%;background:#49ae56;box-shadow:0 0 0 2px #d9f0dc}
.remote-viewer-address-star{margin-left:auto;color:#c69825;font-size:19px;line-height:1}
.remote-viewer-session-modes,.remote-viewer-tools{display:flex;align-items:center;gap:3px;min-width:0}.remote-viewer-mode{width:26px;height:26px;border:1px solid #c8c8c8;border-radius:4px;background:#e4e4e4;color:#555;font-size:11px;cursor:pointer}.remote-viewer-mode.active{background:#d7d7d7;color:#222;font-weight:750;box-shadow:inset 0 0 0 1px #b9b9b9}
.remote-viewer-tools button{display:grid;place-items:center;width:31px;height:28px;border:0;border-radius:4px;background:transparent;color:#555;cursor:pointer}.remote-viewer-tools button:hover{background:#dedede;color:#222}.remote-viewer-tools svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.remote-viewer-command-status{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;color:#505050;font-size:11px}.remote-viewer-command-status span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.remote-viewer-command-more{width:28px;height:28px;border:0;border-radius:4px;background:transparent;color:#555;font-size:18px;line-height:1;cursor:pointer}.remote-viewer-command-more:hover{background:#dedede;color:#222}
.remote-viewer-stage{position:relative;min-height:0;display:grid;place-items:center;overflow:auto;background:#777;padding:32px}
.remote-viewer-screen-frame{position:relative;width:min(100%,1600px);aspect-ratio:16/9;min-height:420px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.45),0 18px 42px rgba(0,0,0,.35);overflow:hidden}
.remote-viewer-screen-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.remote-viewer-loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;align-content:center;gap:12px;background:#f3f3f3;color:#333;font-size:12px}.remote-viewer-loading.hidden{display:none!important}.remote-viewer-loading span{width:31px;height:31px;border:3px solid #d2d2d2;border-top-color:#ef403d;border-radius:50%;animation:remoteViewerSpin .75s linear infinite}.remote-viewer-loading p{margin:0}
.remote-viewer-dock{position:fixed;right:18px;bottom:18px;z-index:49;width:min(360px,calc(100vw - 36px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 11px;border:1px solid #c8c8c8;border-radius:8px;background:#f7f7f7;color:#2b2b2b;box-shadow:0 14px 35px rgba(0,0,0,.24);font-family:"Inter","Segoe UI",sans-serif}.remote-viewer-dock-title{display:flex;align-items:center;gap:9px;min-width:0}.remote-viewer-dock-title strong,.remote-viewer-dock-title small{display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.remote-viewer-dock-title strong{font-size:12px}.remote-viewer-dock-title small{margin-top:2px;font-size:10px;color:#6b6b6b}.remote-viewer-dock-actions{display:flex;gap:6px}.remote-viewer-dock .btn{min-height:28px;padding:6px 9px;border-radius:5px;border:1px solid #cfcfcf;background:#fff;color:#2f2f2f;font-size:10px;font-weight:700;cursor:pointer}.remote-viewer-dock .btn.danger{border-color:#efb1b1;background:#fff5f5;color:#c03636}
.remote-viewer .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes remoteViewerSpin{to{transform:rotate(360deg)}}
@media(max-width:900px){.remote-viewer-product span:last-child{display:none}.remote-viewer-product{min-width:44px}.remote-viewer-command-status span{display:none}.remote-viewer-tools button:nth-child(n+4){display:none}.remote-viewer-stage{padding:12px}.remote-viewer-screen-frame{min-height:300px;width:100%}.remote-viewer-address{width:min(220px,38vw)}}
</style>
<section id="remoteViewer" class="remote-viewer hidden">
  <div class="remote-anydesk-shell">
    <header class="remote-viewer-tabbar">
      <div class="remote-viewer-product" aria-label="CoreControl">
        <span class="remote-viewer-product-mark" aria-hidden="true"></span>
        <span>CoreControl</span>
      </div>
      <div class="remote-viewer-session-tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <strong id="remoteViewerTitle">Acesso remoto</strong>
        <button id="remoteViewerTabClose" type="button" class="remote-viewer-tab-close" aria-label="Encerrar sessão">×</button>
      </div>
      <button id="remoteViewerNewTab" type="button" class="remote-viewer-new-tab" aria-label="Abrir sessão em nova guia" title="Abrir em nova guia">+</button>
      <div class="remote-viewer-window-actions">
        <button id="remoteViewerMinimize" type="button" class="remote-viewer-window-button" aria-label="Minimizar" title="Minimizar"><span aria-hidden="true">—</span></button>
        <button id="remoteViewerFullscreen" type="button" class="remote-viewer-window-button" aria-label="Maximizar" title="Maximizar"><span id="remoteViewerFullscreenLabel" class="sr-only">Maximizar</span><span aria-hidden="true">□</span></button>
        <button id="remoteViewerClose" type="button" class="remote-viewer-window-button remote-viewer-close-button" aria-label="Encerrar" title="Encerrar"><span aria-hidden="true">×</span></button>
      </div>
    </header>

    <div class="remote-viewer-commandbar">
      <div class="remote-viewer-address" title="Sessão remota autorizada">
        <span class="remote-viewer-online-dot" aria-hidden="true"></span>
        <span id="remoteViewerConnectionId">Conectando</span>
        <span class="remote-viewer-address-star" aria-hidden="true">☆</span>
      </div>
      <div class="remote-viewer-session-modes" aria-label="Sessões abertas">
        <button type="button" class="remote-viewer-mode active" aria-label="Sessão atual">1</button>
        <button type="button" class="remote-viewer-mode" aria-label="Nova sessão">2</button>
      </div>
      <div class="remote-viewer-tools" aria-label="Ferramentas da sessão">
        <button type="button" aria-label="Ajustar visualização" title="Ajustar visualização"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg></button>
        <button type="button" aria-label="Teclado e mouse" title="Teclado e mouse"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M10 10h.01M13 10h.01M16 10h.01M7 14h10"/></svg></button>
        <button type="button" aria-label="Área de transferência" title="Área de transferência"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V3h6v2M9 10h6M9 14h5"/></svg></button>
        <button type="button" aria-label="Transferência de arquivos" title="Transferência de arquivos"><svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4z"/><path d="M12 5v8M9 10l3 3 3-3"/></svg></button>
        <button type="button" aria-label="Privacidade" title="Privacidade"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.8 2.9 8 7 10 4.1-2 7-5.2 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></button>
        <button type="button" aria-label="Anotação" title="Anotação"><svg viewBox="0 0 24 24"><path d="m14 5 5 5M5 19l1-4L16 5l3 3L9 18z"/></svg></button>
      </div>
      <div class="remote-viewer-command-status">
        <span id="remoteViewerStatus">Preparando conexão segura...</span>
        <button type="button" class="remote-viewer-command-more" aria-label="Mais opções" title="Mais opções">⋮</button>
      </div>
    </div>

    <main class="remote-viewer-stage">
      <div class="remote-viewer-screen-frame">
        <div id="remoteViewerLoading" class="remote-viewer-loading"><span></span><p>Conectando ao computador...</p></div>
        <iframe id="remoteViewerFrame" title="Área de trabalho remota" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
      </div>
    </main>
  </div>
</section>
<div id="remoteViewerDock" class="remote-viewer-dock hidden" aria-live="polite">
  <div class="remote-viewer-dock-title">
    <span class="remote-viewer-product-mark" aria-hidden="true"></span>
    <div><strong id="remoteViewerDockTitle">Acesso remoto</strong><small id="remoteViewerDockStatus">Sessão minimizada</small></div>
  </div>
  <div class="remote-viewer-dock-actions">
    <button id="remoteViewerRestore" type="button" class="btn small">Restaurar</button>
    <button id="remoteViewerDockClose" type="button" class="btn danger small">Encerrar</button>
  </div>
</div>
