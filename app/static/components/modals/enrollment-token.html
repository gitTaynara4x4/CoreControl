<h2>Adicionar computador</h2>
<p>Envie este link para a pessoa que está no computador da empresa <strong id="tokenCompanyName"></strong>. Ela não precisa receber seu login nem sua senha.</p>
<div class="token-box" id="installationLink"></div>
<div class="callout" id="tokenExpiration" style="margin-top:14px"></div>
<div class="callout" style="margin-top:10px">
  O link é de uso único. Depois que um computador for vinculado, ele deixa de funcionar automaticamente.
</div>
<div class="modal-actions">
  <button class="btn" id="closeToken">Fechar</button>
  <button class="btn" id="downloadHere">Baixar neste computador</button>
  <button class="btn primary" id="copyInstallLink">Copiar link</button>
</div>
