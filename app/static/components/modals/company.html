<h2>Cadastrar empresa</h2>
<p>Os computadores e usuários desta empresa ficarão isolados dos demais clientes.</p>
<form id="companyForm" class="stack">
  <label>Nome da empresa<input id="companyName" required minlength="2" maxlength="160"></label>
  <div class="modal-actions">
    <button type="button" class="btn" id="cancelModal">Cancelar</button>
    <button type="submit" class="btn primary">Cadastrar</button>
  </div>
</form>
