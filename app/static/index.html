<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoreTuner Central</title>
  <link rel="icon" href="/static/logo.png">
  <link rel="stylesheet" href="/static/styles.css?v=20260727-frontend-pages-v1">
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- A tela de login fica em app/static/pages/login.html. -->
  <div id="loginMount"></div>

  <!-- Estrutura fixa do painel. As telas internas ficam em app/static/pages/. -->
  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <img src="/static/logo.png" alt="CoreTuner">
        <div><strong>CoreTuner</strong><span>Central</span></div>
      </div>

      <nav id="mainNav">
        <button data-page="overview" class="nav-item active"><span>⌂</span> Visão geral</button>
        <button data-page="companies" class="nav-item"><span>▦</span> Empresas</button>
        <button data-page="devices" class="nav-item"><span>▣</span> Computadores</button>
        <button data-page="alerts" class="nav-item"><span>!</span> Alertas <b id="navAlertCount" class="badge hidden">0</b></button>
        <button data-page="users" class="nav-item"><span>♙</span> Usuários</button>
        <div class="nav-section">Gestão remota</div>
        <button data-page="remote" class="nav-item"><span>↗</span> Acesso remoto</button>
        <button class="nav-item muted" disabled><span>↻</span> Atualizações <em>Em breve</em></button>
        <button class="nav-item muted" disabled><span>&gt;_</span> Scripts <em>Em breve</em></button>
        <button class="nav-item muted" disabled><span>⌁</span> Rede <em>Em breve</em></button>
      </nav>

      <div class="sidebar-footer">
        <div class="security-note"><span>✓</span><div><strong>Proteção ativa</strong><small>Telemetria somente leitura</small></div></div>
        <button id="logoutBtn" class="nav-item"><span>↪</span> Sair</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Visão geral</h1>
          <p id="pageSubtitle">Acompanhe as empresas e computadores em tempo quase real.</p>
        </div>
        <div class="top-actions">
          <span id="lastRefresh" class="refresh-label">Aguardando atualização</span>
          <button id="refreshBtn" class="icon-btn" title="Atualizar">↻</button>
          <div class="user-chip"><span id="userInitial">A</span><div><strong id="userName">Administrador</strong><small id="userRole">Administrador</small></div></div>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal"></div>
  </div>

  <!-- O visualizador remoto fica em app/static/components/remote-viewer.html. -->
  <div id="remoteViewerMount"></div>

  <script defer src="/static/js/core.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/ui.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/auth.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/router.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/modals.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/pages/overview.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/pages/companies.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/pages/devices.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/pages/alerts.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/pages/remote.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/js/pages/users.js?v=20260727-frontend-pages-v1"></script>
  <script defer src="/static/app.js?v=20260727-frontend-pages-v1"></script>
</body>
</html>
