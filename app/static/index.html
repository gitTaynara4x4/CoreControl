<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoreTuner Central</title>
  <link rel="icon" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=20260821-valora-ui-v1">
  <link rel="stylesheet" href="/static/login.css?v=20260821-split-compact-v1">
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- A tela de login fica em app/static/pages/login.html. -->
  <div id="loginMount"></div>

  <!-- Estrutura fixa do painel. As telas internas ficam em app/static/pages/. -->
  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/static/coretuner-auth-brand.png" alt="CoreTuner">
        <span class="brand-caption">Central</span>
      </div>

      <nav id="mainNav">
        <button data-page="overview" class="nav-item active">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5M5.5 10v9h13v-9M9.5 19v-5h5v5"/></svg></span>
          <span class="nav-label">Visão geral</span>
        </button>
        <button data-page="companies" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V7l8-3v16M12 9h8v11M7 9h2M7 13h2M7 17h2M15 12h2M15 16h2"/></svg></span>
          <span class="nav-label">Empresas</span>
        </button>
        <button data-page="devices" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="12" rx="2"/><path d="M8 20h8M12 16.5V20"/></svg></span>
          <span class="nav-label">Computadores</span>
        </button>
        <button data-page="alerts" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><path d="M12 4 3.8 18h16.4L12 4zM12 9v4M12 16h.01"/></svg></span>
          <span class="nav-label">Alertas</span> <b id="navAlertCount" class="badge hidden">0</b>
        </button>
        <button data-page="users" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><path d="M16 19v-1.2c0-2.1-1.8-3.8-4-3.8s-4 1.7-4 3.8V19M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 8.5a2.4 2.4 0 0 1 0 4.6M19.5 18v-.8c0-1.4-.7-2.7-1.8-3.4"/></svg></span>
          <span class="nav-label">Usuários</span>
        </button>
        <div class="nav-section">Gestão remota</div>
        <button data-page="remote" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><path d="M8 16 16 8M10 8h6v6M5 5h5M5 5v14h14v-5"/></svg></span>
          <span class="nav-label">Acesso remoto</span>
        </button>
        <button class="nav-item muted" disabled>
          <span class="nav-icon" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></span>
          <span class="nav-label">Atualizações</span><em>Em breve</em>
        </button>
        <button class="nav-item muted" disabled>
          <span class="nav-icon" aria-hidden="true"><path d="m8 9-3 3 3 3M16 9l3 3-3 3M13 6l-2 12"/></svg></span>
          <span class="nav-label">Scripts</span><em>Em breve</em>
        </button>
        <button class="nav-item muted" disabled>
          <span class="nav-icon" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><path d="M5.6 8.7a8 8 0 0 1 12.8 0M8.6 11.2a4.5 4.5 0 0 1 6.8 0M3.2 6a11.5 11.5 0 0 1 17.6 0"/></svg></span>
          <span class="nav-label">Rede</span><em>Em breve</em>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="security-note"><span>✓</span><div><strong>Proteção ativa</strong><small>Telemetria somente leitura</small></div></div>
        <button id="logoutBtn" class="nav-item"><span>↪</span> Sair</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Visão geral</h1>
          <p id="pageSubtitle">Acompanhe as empresas e computadores em tempo quase real.</p>
        </div>
        <div class="top-actions">
          <span id="lastRefresh" class="refresh-label">Aguardando atualização</span>
          <button id="refreshBtn" class="icon-btn" title="Atualizar" aria-label="Atualizar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.35-5.65M20 4v5h-5"/></svg>
          </button>
          <div class="user-chip"><span id="userInitial">A</span><div><strong id="userName">Administrador</strong><small id="userRole">Administrador</small></div></div>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal"></div>
  </div>

  <!-- O visualizador remoto fica em app/static/components/remote-viewer.html. -->
  <div id="remoteViewerMount"></div>

  <script defer src="/static/js/core.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/js/ui.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/js/auth.js?v=20260821-split-compact-v1"></script>
  <script defer src="/static/js/router.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/js/modals.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/js/pages/overview.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/js/pages/companies.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/js/pages/devices.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/js/pages/alerts.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/js/pages/remote.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/js/pages/users.js?v=20260727-frontend-pages-v2"></script>
  <script defer src="/static/app.js?v=20260727-frontend-pages-v2"></script>
</body>
</html>
