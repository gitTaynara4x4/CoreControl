  <script src="/static/js/theme.js?v=20260830-device-reinstall-v1"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
  <div id="toast" class="toast"></div>

  <!-- A tela de login fica em app/static/pages/login.html. -->

  <!-- Estrutura fixa do painel. As telas internas ficam em app/static/pages/. -->
  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo-full" src="/static/corecontrol-logo.png" alt="CoreControl">
      </div>

      <nav id="mainNav" aria-label="Navegação principal">
        <div class="nav-section nav-section-first">Principal</div>

        <button data-page="overview" class="nav-item active">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.75 10.9 12 3.75l8.25 7.15"/><path d="M5.5 9.6V20h13V9.6"/><path d="M9.25 20v-5.7h5.5V20"/></svg></span>
          <span class="nav-label">Visão geral</span>
        </button>
        <button data-page="companies" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V7.25L12 4v16"/><path d="M12 9h8v11H4"/><path d="M7.25 10h1.5M7.25 13.5h1.5M7.25 17h1.5M15.25 12.5h1.5M15.25 16h1.5"/></svg></span>
          <span class="nav-label">Empresas</span>
        </button>
        <button data-page="devices" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="12" rx="2"/><path d="M8 20h8M12 16.5V20"/></svg></span>
          <span class="nav-label">Computadores</span>
        </button>
        <button data-page="alerts" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.8 3.6 19h16.8L12 3.8Z"/><path d="M12 9v4.25M12 16.5h.01"/></svg></span>
          <span class="nav-label">Alertas</span><b id="navAlertCount" class="badge hidden">0</b>
        </button>
        <button data-page="users" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9.5" cy="8" r="3"/><path d="M4.25 19c.45-3.35 2.35-5.15 5.25-5.15s4.8 1.8 5.25 5.15"/><path d="M16.2 5.7a2.7 2.7 0 0 1 0 5.1M16.4 13.5c2.15.45 3.1 2.1 3.35 4.5"/></svg></span>
          <span class="nav-label">Usuários</span>
        </button>

        <div class="nav-section">Gestão remota</div>
        <button data-page="remote" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="13" rx="2"/><path d="M8 21h8M12 17.5V21M14 8h3v3M17 8l-5.25 5.25"/></svg></span>
          <span class="nav-label">Acesso remoto</span>
        </button>
        <button data-page="updates" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.35 5.65"/><path d="M20 4v7h-7"/></svg></span>
          <span class="nav-label">Atualizações</span>
        </button>
        <button data-page="scripts" class="nav-item">

          <span class="nav-label">Scripts</span>
        </button>

          <span class="nav-label">Rede</span>
        </button>

        <div class="nav-section">Administração</div>
        <button data-page="reports" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 20V10.5h4V20M10 20V4.5h4V20M15.5 20v-7h4v7M3 20h18"/></svg></span>
          <span class="nav-label">Relatórios</span>
        </button>
        <button data-page="settings" class="nav-item admin-nav">
          <span class="nav-icon" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 13.4v-2.8l-2.05-.6a7 7 0 0 0-.65-1.55l1.03-1.88-1.98-1.98-1.88 1.03A7 7 0 0 0 11.9 5L11.3 3H8.5l-.6 2.05a7 7 0 0 0-1.55.65L4.47 4.67 2.49 6.65l1.03 1.88A7 7 0 0 0 2.87 10L.82 10.6v2.8l2.05.6c.15.55.37 1.07.65 1.55l-1.03 1.88 1.98 1.98 1.88-1.03c.48.28 1 .5 1.55.65L8.5 21h2.8l.6-2.05a7 7 0 0 0 1.55-.65l1.88 1.03 1.98-1.98-1.03-1.88c.28-.48.5-1 .65-1.55L19 13.4Z" transform="translate(1.1 0) scale(.9)"/></svg></span>

        </button>

          <div class="user-chip sidebar-user-chip"><span id="userInitial">A</span><div><strong id="userName">Administrador</strong><small id="userRole">Administrador</small></div></div>
          <div class="sidebar-utility-row">
            <span id="lastRefresh" class="refresh-label sidebar-refresh-label">Aguardando atualização</span>
            <button id="refreshBtn" class="icon-btn sidebar-refresh-btn" title="Atualizar" aria-label="Atualizar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.35-5.65M20 4v5h-5"/></svg>
            </button>
          </div>
        </div>
        <div class="settings-wrap">
          <button id="appearanceBtn" class="nav-item appearance-item" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.4v-2.8l-2.05-.6a7 7 0 0 0-.65-1.55l1.03-1.88-1.98-1.98-1.88 1.03A7 7 0 0 0 11.9 5L11.3 3H8.5l-.6 2.05a7 7 0 0 0-1.55.65L4.47 4.67 2.49 6.65l1.03 1.88A7 7 0 0 0 2.87 10L.82 10.6v2.8l2.05.6c.15.55.37 1.07.65 1.55l-1.03 1.88 1.98 1.98 1.88-1.03c.48.28 1 .5 1.55.65L8.5 21h2.8l.6-2.05a7 7 0 0 0 1.55-.65l1.88 1.03 1.98-1.98-1.03-1.88c.28-.48.5-1 .65-1.55L19 13.4Z" transform="translate(1.1 0) scale(.9)"/></svg></span>

          </button>
          <div id="appearanceMenu" class="appearance-menu hidden" role="menu" aria-label="Escolher aparência">
            <div class="appearance-menu-head"><strong>Aparência</strong><small>Escolha o tema do painel</small></div>
            <button class="theme-option" type="button" data-theme-option="light" role="menuitemradio" aria-checked="true">
              <span class="theme-option-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M5.3 5.3 6.7 6.7M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg></span>
              <span><strong>Claro</strong><small>Fundo claro</small></span><i class="theme-check">✓</i>
            </button>
            <button class="theme-option" type="button" data-theme-option="dark" role="menuitemradio" aria-checked="false">
              <span class="theme-option-icon"><svg viewBox="0 0 24 24"><path d="M20.2 15.3A8.2 8.2 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"/></svg></span>
              <span><strong>Escuro</strong><small>Fundo escuro</small></span><i class="theme-check">✓</i>
            </button>
          </div>
        </div>
        <div class="security-note"><span>✓</span><div><strong>Proteção ativa</strong><small>Telemetria somente leitura</small></div></div>
        <button id="logoutBtn" class="nav-item logout-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"/></svg></span><span class="nav-label">Sair</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Visão geral</h1>
          <p id="pageSubtitle">Acompanhe as empresas e computadores em tempo quase real.</p>
        </div>

      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal"></div>
  </div>
