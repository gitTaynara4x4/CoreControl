<section class="page page-network">
  <div class="network-commandbar">
    <div class="network-tabs" role="tablist" aria-label="Áreas de rede">
      <button class="active" type="button" role="tab" aria-selected="true" data-network-tab="overview">
        <span>Visão geral</span>
      </button>
      <button type="button" role="tab" aria-selected="false" data-network-tab="tests">
        <span>Testes</span>
      </button>
      <button type="button" role="tab" aria-selected="false" data-network-tab="devices">
        <span>Dispositivos</span>
      </button>
    </div>

    <div class="network-toolbar">
      <button id="networkTestBtn" class="btn primary" type="button">
        <span class="network-btn-icon" aria-hidden="true">+</span>
        <span>Novo teste de rede</span>
      </button>
    </div>
  </div>

  <div id="networkView" class="network-view" aria-live="polite"></div>
</section>
