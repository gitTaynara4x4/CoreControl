<section class="page page-module page-scripts">
  <div class="scripts-commandbar">
    <div class="scripts-tabs" role="tablist" aria-label="Áreas de scripts">
      <button class="active" type="button" data-script-tab="library" role="tab" aria-selected="true">Biblioteca</button>
      <button type="button" data-script-tab="executions" role="tab" aria-selected="false">Execuções</button>
      <button type="button" data-script-tab="schedules" role="tab" aria-selected="false">Agendamentos</button>
    </div>
    <div class="scripts-toolbar">
      <button id="scriptRunBtn" class="btn" type="button">Executar script</button>
      <button id="scriptNewBtn" class="btn primary" type="button">Novo script</button>
    </div>
  </div>
  <div id="scriptsView" class="scripts-view" aria-live="polite"></div>
</section>
