<section id="loginView" class="login-shell hidden">
  <div class="login-card login-card-wide">
    <img src="/static/logo.png" alt="CoreTuner" class="login-logo">
    <h1>CoreTuner Central</h1>
    <p>Entre na sua empresa ou crie o primeiro acesso.</p>

    <div class="login-tabs">
      <button id="centralLoginTab" type="button" class="active">Entrar</button>
      <button id="centralRegisterTab" type="button">Criar empresa</button>
    </div>

    <form id="loginForm" class="stack">
      <label>E-mail<input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>Senha<input id="loginPassword" type="password" autocomplete="current-password" required minlength="8"></label>
      <div class="login-help-row">
        <button id="centralForgotPassword" type="button" class="login-help-link">Esqueci minha senha</button>
      </div>
      <button class="btn primary" type="submit">Entrar</button>
    </form>

    <form id="registerCompanyForm" class="stack hidden">
      <label>Nome da empresa<input id="centralCompanyName" required minlength="2" maxlength="160"></label>
      <label>Nome do responsável<input id="centralResponsibleName" required minlength="2" maxlength="120"></label>
      <label>E-mail<input id="centralRegisterEmail" type="email" autocomplete="username" required></label>
      <label>Senha<input id="centralRegisterPassword" type="password" autocomplete="new-password" required minlength="10"></label>
      <label>Confirmar senha<input id="centralRegisterPasswordConfirmation" type="password" autocomplete="new-password" required minlength="10"></label>
      <button class="btn primary" type="submit">Criar empresa</button>
    </form>

    <small>A mesma conta funciona no site, no aplicativo e no painel.</small>
  </div>
</section>
