<section class="page page-updates">
  <div class="updates-commandbar">
    <div class="updates-tabs" role="tablist" aria-label="Áreas de atualizações">
      <button class="active" type="button" role="tab" aria-selected="true" data-module-tab="overview">
        <span>Visão geral</span>
      </button>
      <button type="button" role="tab" aria-selected="false" data-module-tab="computers">
        <span>Computadores</span>
      </button>
      <button type="button" role="tab" aria-selected="false" data-module-tab="policies">
        <span>Políticas</span>
      </button>
    </div>

    <div class="updates-toolbar">
      <button id="updatesPolicyBtn" class="btn" type="button">Configurar política</button>
      <button id="updatesCheckBtn" class="btn primary updates-check-all" type="button">
        <span class="updates-btn-icon" aria-hidden="true">↻</span>
        <span>Verificar agora</span>
      </button>
    </div>
  </div>

  <div id="updatesView" class="updates-view" aria-live="polite"></div>
</section>
