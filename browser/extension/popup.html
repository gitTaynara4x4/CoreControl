<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CoreControl</title>
  <style>
    body{font-family:Arial,sans-serif;width:280px;margin:0;padding:16px;color:#172033;background:#fff}
    h1{font-size:16px;margin:0 0 6px}.muted{font-size:12px;color:#667085;line-height:1.45}
    .status{margin:14px 0;padding:10px 12px;border:1px solid #e4e8ef;border-radius:10px;font-size:12px}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#98a2b3;margin-right:7px}.ok .dot{background:#22a35a}.bad .dot{background:#e5484d}
    button{width:100%;border:0;border-radius:8px;padding:10px;background:#2f7cf6;color:white;cursor:pointer;font-weight:600}
    small{display:block;margin-top:12px;color:#7b8497;line-height:1.4}
  </style>
</head>
<body>
  <h1>CoreControl</h1>
  <div class="muted">Compartilha somente o nome da página, endereço e qual aba está ativa para o módulo Atividade.</div>
  <div id="status" class="status"><span class="dot"></span><span id="statusText">Verificando integração…</span></div>
  <button id="sync">Atualizar agora</button>
  <small>Não lê senhas, textos digitados ou conteúdo interno das páginas. Abas anônimas não são enviadas.</small>
  <script src="popup.js"></script>
</body>
</html>
