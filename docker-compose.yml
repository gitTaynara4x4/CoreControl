services:
  coretuner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coretuner-central
    restart: unless-stopped
    ports:
      - "8280:8280"
    environment:
      CORETUNER_ENV: ${CORETUNER_DOCKER_ENV:-production}
      CORETUNER_PORT: 8280
      CORETUNER_SECRET_KEY: ${CORETUNER_SECRET_KEY}
      CORETUNER_ADMIN_EMAIL: ${CORETUNER_ADMIN_EMAIL}
      CORETUNER_ADMIN_PASSWORD: ${CORETUNER_ADMIN_PASSWORD}
      CORETUNER_DOWNLOAD_PASSWORD: ${CORETUNER_DOWNLOAD_PASSWORD}
      CORETUNER_DATABASE_URL: ${CORETUNER_DATABASE_URL}
      CORETUNER_PUBLIC_URL: ${CORETUNER_PUBLIC_URL}
      CORETUNER_DOWNLOAD_TOKEN_SECONDS: ${CORETUNER_DOWNLOAD_TOKEN_SECONDS:-180}
      CORETUNER_DOWNLOAD_MAX_ATTEMPTS: ${CORETUNER_DOWNLOAD_MAX_ATTEMPTS:-5}
      CORETUNER_DOWNLOAD_ATTEMPT_WINDOW_SECONDS: ${CORETUNER_DOWNLOAD_ATTEMPT_WINDOW_SECONDS:-600}
      CORETUNER_DOWNLOAD_BLOCK_SECONDS: ${CORETUNER_DOWNLOAD_BLOCK_SECONDS:-900}
      CORETUNER_OFFLINE_AFTER_SECONDS: ${CORETUNER_OFFLINE_AFTER_SECONDS:-180}
      CORETUNER_TELEMETRY_RETENTION_DAYS: ${CORETUNER_TELEMETRY_RETENTION_DAYS:-30}
      CORETUNER_SMTP_HOST: ${CORETUNER_SMTP_HOST:-smtp.gmail.com}
      CORETUNER_SMTP_PORT: ${CORETUNER_SMTP_PORT:-587}
      CORETUNER_SMTP_USER: ${CORETUNER_SMTP_USER:-}
      CORETUNER_SMTP_PASSWORD: ${CORETUNER_SMTP_PASSWORD:-}
      CORETUNER_SMTP_FROM_EMAIL: ${CORETUNER_SMTP_FROM_EMAIL:-}
      CORETUNER_SMTP_FROM_NAME: ${CORETUNER_SMTP_FROM_NAME:-CoreTuner}
      CORETUNER_SMTP_STARTTLS: ${CORETUNER_SMTP_STARTTLS:-true}
      CORETUNER_PASSWORD_RESET_MINUTES: ${CORETUNER_PASSWORD_RESET_MINUTES:-20}
      CORETUNER_PASSWORD_RESET_MAX_ATTEMPTS: ${CORETUNER_PASSWORD_RESET_MAX_ATTEMPTS:-5}
      CORETUNER_PASSWORD_RESET_WINDOW_SECONDS: ${CORETUNER_PASSWORD_RESET_WINDOW_SECONDS:-900}
      CORETUNER_REMOTE_ENABLED: ${CORETUNER_REMOTE_ENABLED:-false}
      CORETUNER_REMOTE_URL: ${CORETUNER_REMOTE_URL:-}
      CORETUNER_REMOTE_AGENT_FILENAME: ${CORETUNER_REMOTE_AGENT_FILENAME:-CoreTunerRemoteAgent.exe}
      CORETUNER_REMOTE_LOGIN_TOKEN_KEY: ${CORETUNER_REMOTE_LOGIN_TOKEN_KEY:-}
      CORETUNER_REMOTE_LOGIN_USER: ${CORETUNER_REMOTE_LOGIN_USER:-coretuner-integracao}
      CORETUNER_REMOTE_LOGIN_DOMAIN: ${CORETUNER_REMOTE_LOGIN_DOMAIN:-}
      CORETUNER_REMOTE_LOGIN_TOKEN_MINUTES: ${CORETUNER_REMOTE_LOGIN_TOKEN_MINUTES:-2}
      CORETUNER_REMOTE_ADMIN_USER: ${CORETUNER_REMOTE_ADMIN_USER:-user-mesh-adm}
      CORETUNER_REMOTE_NODE_PATH: ${CORETUNER_REMOTE_NODE_PATH:-node}
      CORETUNER_REMOTE_MESHCTRL_PATH: ${CORETUNER_REMOTE_MESHCTRL_PATH:-/opt/meshcentral-client/node_modules/meshcentral/meshctrl.js}
      CORETUNER_REMOTE_AGENT_TYPE: ${CORETUNER_REMOTE_AGENT_TYPE:-4}
      CORETUNER_REMOTE_AGENT_INSTALL_FLAGS: ${CORETUNER_REMOTE_AGENT_INSTALL_FLAGS:-2}
      CORETUNER_REMOTE_GROUP_FEATURES: ${CORETUNER_REMOTE_GROUP_FEATURES:-2}
      CORETUNER_REMOTE_GROUP_CONSENT: ${CORETUNER_REMOTE_GROUP_CONSENT:-73}
      CORETUNER_REMOTE_COMMAND_TIMEOUT_SECONDS: ${CORETUNER_REMOTE_COMMAND_TIMEOUT_SECONDS:-45}
      CORETUNER_REMOTE_AGENT_DOWNLOAD_TIMEOUT_SECONDS: ${CORETUNER_REMOTE_AGENT_DOWNLOAD_TIMEOUT_SECONDS:-90}
      CORETUNER_REMOTE_AGENT_CACHE_SECONDS: ${CORETUNER_REMOTE_AGENT_CACHE_SECONDS:-86400}
      CORETUNER_REMOTE_STATUS_CACHE_SECONDS: ${CORETUNER_REMOTE_STATUS_CACHE_SECONDS:-15}
      CORETUNER_REMOTE_STATUS_STALE_SECONDS: ${CORETUNER_REMOTE_STATUS_STALE_SECONDS:-120}
    volumes:
      - coretuner_data:/data

volumes:
  coretuner_data:
